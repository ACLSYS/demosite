/* ────────────────────────────────────────────────────────────
   FADE-UP ON SCROLL
   ──────────────────────────────────────────────────────────── */
function useFadeUp(threshold = 0.15) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
    }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, visible];
}
function FadeUp({ children, delay = 0, className = "" }) {
  const [ref, visible] = useFadeUp();
  return (
    <div ref={ref} className={className} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? "translateY(0)" : "translateY(24px)",
      transition: `opacity 500ms ease ${delay}ms, transform 500ms ease ${delay}ms`,
    }}>{children}</div>
  );
}

function PhotoBlock({ label, className = "", radius = 30, variant = 0 }) {

    `linear-gradient(135deg, ${T.rose} 0%, ${T.champagne} 100%)`,
    `linear-gradient(160deg, #F3E4DC 0%, ${T.rose} 100%)`,
    `linear-gradient(200deg, ${T.champagne} 0%, #F6ECE7 100%)`,
  ];
  return (
    <div className={`relative overflow-hidden flex items-end p-4 ${className}`}
      style={{ borderRadius: radius, background: variants[variant % variants.length], boxShadow: softShadow }}>
      <span className="text-white/90 text-xs font-medium tracking-wide" style={{ fontFamily: "Inter, sans-serif" }}>{label}</span>

    <header className="sticky top-0 z-50 w-full" style={{

      borderBottom: `1px solid ${scrolled ? T.border : "transparent"}`,
      transition: "background-color 250ms ease, border-color 250ms ease",
    }}>
      <div className="max-w-[1440px] mx-auto h-full px-5 sm:px-8 lg:px-12 flex items-center justify-between">

        <button className="md:hidden p-2 focus-visible:outline focus-visible:outline-2" style={{ minWidth: 44, minHeight: 44, outlineColor: T.rose }}

          {open ? <XIcon size={24} color={T.textPrimary} /> : <MenuIcon size={24} color={T.textPrimary} />}

        </div>

}

  );
}
function TeamCard({ member }) {
  return (
    <div className="p-5 flex flex-col items-center text-center gap-1" style={{ backgroundColor: T.card, borderRadius: 28, boxShadow: softShadow, border: `1px solid ${T.border}` }}>
      <PhotoBlock label="" className="w-full h-36 mb-3" radius={20} variant={1} />
      <h4 className="text-base" style={{ fontFamily: "'Playfair Display', serif", color: T.textPrimary }}>{member.name}</h4>
      <p className="text-xs" style={{ color: T.rose, fontFamily: "Inter, sans-serif" }}>{member.role}</p>
      <p className="text-xs" style={{ color: T.textSecondary, fontFamily: "Inter, sans-serif" }}>{member.years}</p>
    </div>
  );
}
function FinalCTA({ setPage }) {
  const go = (id) => { setPage(id); window.scrollTo({ top: 0, behavior: "smooth" }); };
  return (
    <section className="py-16 px-5 sm:px-8 lg:px-12">
      <div className="max-w-[1440px] mx-auto">
        <FadeUp>
          <div className="relative overflow-hidden p-8 sm:p-14 flex flex-col sm:flex-row items-center gap-8" style={{ borderRadius: 28, backgroundColor: "#241F1E", boxShadow: softShadowLg }}>
            <div className="flex-1 text-center sm:text-left">
              <h3 className="text-2xl sm:text-3xl mb-4" style={{ fontFamily: "'Playfair Display', serif", color: "white" }}>Reserva tu momento de calma</h3>
              <p className="text-sm sm:text-base mb-7" style={{ color: "#C9C0BC", fontFamily: "Inter, sans-serif" }}>Escríbenos y encontramos el horario ideal para ti.</p>
              <div className="flex flex-wrap justify-center sm:justify-start gap-4">
                <PrimaryButton onClick={() => go("nosotros")}>Reservar cita</PrimaryButton>
                <SecondaryButton onClick={() => {}} className="!text-white !border-white/20"><MessageCircleIcon size={16} /> WhatsApp</SecondaryButton>
              </div>
            </div>
            <PhotoBlock label="" className="w-full sm:w-64 h-48 hidden sm:block" radius={24} variant={3} />
          </div>
        </FadeUp>
      </div>
    </section>
  );
}

/* ────────────────────────────────────────────────────────────
   SERVICIOS PAGE
   ──────────────────────────────────────────────────────────── */
function ServiciosPage({ setPage }) {
  const [active, setActive] = useState("Todos");
  const categories = ["Todos", "Manos", "Rostro", "Cuerpo", "Mirada"];
  const categoryMap = { Manicure: "Manos", Facial: "Rostro", "Masaje relajante": "Cuerpo", Aromaterapia: "Cuerpo", Peinado: "Rostro", "Cejas y pestañas": "Mirada" };
  const filtered = active === "Todos" ? SERVICES : SERVICES.filter((s) => categoryMap[s.name] === active);
  return (
    <>
      <section className="pt-14 sm:pt-20 pb-10 px-5 sm:px-8 lg:px-12">
        <div className="max-w-[1440px] mx-auto">
          <FadeUp><SectionHeading center={false} eyebrow="Servicios" title="Nuestro catálogo completo" subtitle="Cada tratamiento está diseñado para que salgas sintiéndote renovada, con productos y técnicas de calidad." /></FadeUp>
          <FadeUp>
            <div className="flex flex-wrap gap-3 mb-12">
              {categories.map((c) => (
                <button key={c} onClick={() => setActive(c)} className="px-5 py-2.5 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2"
                  style={{ fontFamily: "Inter, sans-serif", borderRadius: 18, minHeight: 44, backgroundColor: active === c ? T.rose : "transparent", color: active === c ? "white" : T.textPrimary, border: `1px solid ${active === c ? T.rose : T.border}`, outlineColor: T.rose }}>{c}</button>
              ))}
            </div>
          </FadeUp>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {filtered.map((s, i) => (<FadeUp key={s.name} delay={i * 80}><ServiceCard service={s} /></FadeUp>))}
          </div>
        </div>
      </section>

      <section className="py-16 px-5 sm:px-8 lg:px-12" style={{ backgroundColor: T.bg }}>
        <div className="max-w-[1440px] mx-auto">
          <FadeUp><SectionHeading eyebrow="Galería" title="El espacio Caribbean" subtitle="Un vistazo a nuestras salas de tratamiento." /></FadeUp>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-5">
            {[{ label: "Sala de manicure", v: 0 }, { label: "Cabina facial", v: 1 }, { label: "Sala de masajes", v: 2 }, { label: "Recepción", v: 3 }].map((g, i) => (
              <FadeUp key={g.label} delay={i * 100}><PhotoBlock label={g.label} className="h-52 sm:h-64 w-full" radius={30} variant={g.v} /></FadeUp>
            ))}
          </div>
        </div>
      </section>

      <FinalCTA setPage={setPage} />
    </>
  );
}

/* ────────────────────────────────────────────────────────────
   NOSOTROS PAGE
   ──────────────────────────────────────────────────────────── */
function NosotrosPage() {
  const [form, setForm] = useState({ nombre: "", telefono: "", servicio: "", mensaje: "" });
  const [sent, setSent] = useState(false);
  const handleChange = useCallback((field) => (e) => setForm((f) => ({ ...f, [field]: e.target.value })), []);
  const handleSubmit = (e) => { e.preventDefault(); setSent(true); };
  return (
    <>
      <section className="pt-14 sm:pt-20 pb-16 px-5 sm:px-8 lg:px-12">
        <div className="max-w-[1440px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
          <FadeUp>
            <p className="text-xs tracking-[0.2em] uppercase mb-4 font-medium" style={{ color: T.rose, fontFamily: "Inter, sans-serif" }}>Nosotros</p>
            <h1 className="text-3xl sm:text-4xl lg:text-[2.75rem] leading-tight mb-6" style={{ fontFamily: "'Playfair Display', serif", color: T.textPrimary }}>Nacimos para crear un lugar donde el tiempo se detiene</h1>
            <p className="text-base leading-relaxed" style={{ color: T.textSecondary, fontFamily: "Inter, sans-serif" }}>Desde 2016, Caribbean combina técnicas profesionales con productos naturales en un espacio diseñado para el descanso. Creemos que el autocuidado no es un lujo — es parte esencial del bienestar.</p>
          </FadeUp>
          <FadeUp delay={150}><PhotoBlock label="Equipo Caribbean" className="h-[320px] w-full" radius={32} variant={1} /></FadeUp>
        </div>
      </section>

      <section className="py-16 px-5 sm:px-8 lg:px-12" style={{ backgroundColor: T.bg }}>
        <div className="max-w-[1440px] mx-auto grid grid-cols-1 sm:grid-cols-3 gap-6">
          {[
            { title: "Productos de calidad", desc: "Trabajamos solo con marcas certificadas y de origen natural." },
            { title: "Higiene rigurosa", desc: "Protocolos estrictos de limpieza en cada sala y herramienta." },
            { title: "Experiencia personalizada", desc: "Cada tratamiento se adapta a lo que tu piel y cuerpo necesitan." },
          ].map((v, i) => (
            <FadeUp key={v.title} delay={i * 100}>
              <div className="p-7 h-full" style={{ backgroundColor: T.card, borderRadius: 28, boxShadow: softShadow, border: `1px solid ${T.border}` }}>
                <h3 className="text-lg mb-2" style={{ fontFamily: "'Playfair Display', serif", color: T.textPrimary }}>{v.title}</h3>
                <p className="text-sm leading-relaxed" style={{ color: T.textSecondary, fontFamily: "Inter, sans-serif" }}>{v.desc}</p>
              </div>
            </FadeUp>
          ))}
        </div>
      </section>

      <section className="py-16 px-5 sm:px-8 lg:px-12">
        <div className="max-w-[1440px] mx-auto">
          <FadeUp><SectionHeading eyebrow="Equipo" title="Conoce a las expertas" /></FadeUp>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-6">
            {TEAM.map((m, i) => (<FadeUp key={m.name} delay={i * 100}><TeamCard member={m} /></FadeUp>))}
          </div>
        </div>
      </section>

      <section className="py-16 px-5 sm:px-8 lg:px-12" style={{ backgroundColor: T.bg }}>
        <div className="max-w-[1440px] mx-auto">
          <FadeUp><SectionHeading eyebrow="Contacto" title="Reserva tu cita" subtitle="Escríbenos y te confirmamos por WhatsApp o correo." /></FadeUp>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <FadeUp>
              <div className="p-7 sm:p-8" style={{ backgroundColor: T.card, borderRadius: 28, boxShadow: softShadow, border: `1px solid ${T.border}` }}>
                {sent ? (
                  <div className="py-10 text-center">
                    <p className="text-lg mb-2" style={{ fontFamily: "'Playfair Display', serif", color: T.textPrimary }}>¡Gracias, {form.nombre || "un placer"}!</p>
                    <p className="text-sm" style={{ color: T.textSecondary, fontFamily: "Inter, sans-serif" }}>Te contactaremos pronto para confirmar tu cita.</p>
                  </div>
                ) : (
                  <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                    <Field label="Nombre" value={form.nombre} onChange={handleChange("nombre")} placeholder="Tu nombre" required />
                    <Field label="Teléfono" value={form.telefono} onChange={handleChange("telefono")} placeholder="55 1234 5678" type="tel" required />
                    <Field label="Servicio de interés" value={form.servicio} onChange={handleChange("servicio")} placeholder="Ej. Facial, Masaje…" />
                    <div>
                      <label className="text-sm font-medium mb-1.5 block" style={{ color: T.textPrimary, fontFamily: "Inter, sans-serif" }}>Mensaje (opcional)</label>
                      <textarea value={form.mensaje} onChange={handleChange("mensaje")} rows={3} placeholder="Cuéntanos qué buscas…"
                        className="w-full px-4 py-3 text-sm focus-visible:outline focus-visible:outline-2"
                        style={{ borderRadius: 18, border: `1px solid ${T.border}`, fontFamily: "Inter, sans-serif", color: T.textPrimary, outlineColor: T.rose, resize: "vertical" }} />
                    </div>
                    <PrimaryButton type="submit" className="mt-2">Enviar solicitud</PrimaryButton>
                  </form>
                )}
              </div>
            </FadeUp>
            <FadeUp delay={100}>
              <div className="flex flex-col gap-5 h-full">
                <div className="flex-1 min-h-[220px] flex items-center justify-center" style={{ borderRadius: 28, backgroundColor: T.champagne, boxShadow: softShadow }}>
                  <div className="text-center px-6">
                    <MapPinIcon size={28} color="#8A5C52" style={{ margin: "0 auto 8px" }} />
                    <p className="text-sm font-medium" style={{ color: "#5C4A45", fontFamily: "Inter, sans-serif" }}>Av. Reforma 123, Ciudad de México</p>
                    <p className="text-xs mt-1" style={{ color: "#8A5C52", fontFamily: "Inter, sans-serif" }}>(Mapa interactivo — Google Maps embed en producción)</p>
                  </div>
                </div>
                <div className="p-6 flex flex-col gap-3" style={{ backgroundColor: T.card, borderRadius: 28, boxShadow: softShadow, border: `1px solid ${T.border}` }}>
                  <InfoRow icon={ClockIcon} text="Lun–Vie 9:00–20:00 · Sáb 9:00–18:00" />
                  <InfoRow icon={PhoneIcon} text="+52 55 1234 5678" />
                  <InfoRow icon={MailIcon} text="hola@caribbeanbeauty.com" />
                </div>
              </div>
            </FadeUp>
          </div>
        </div>
      </section>
    </>
  );
}
function Field({ label, ...props }) {
  return (
    <div>
      <label className="text-sm font-medium mb-1.5 block" style={{ color: T.textPrimary, fontFamily: "Inter, sans-serif" }}>{label}</label>
      <input {...props} className="w-full px-4 py-3 text-sm focus-visible:outline focus-visible:outline-2"
        style={{ borderRadius: 18, border: `1px solid ${T.border}`, fontFamily: "Inter, sans-serif", color: T.textPrimary, minHeight: 44, outlineColor: T.rose }} />
    </div>
  );
}
function InfoRow({ icon: IconComp, text }) {
  return (
    <div className="flex items-center gap-3 text-sm" style={{ color: T.textSecondary, fontFamily: "Inter, sans-serif" }}>
      <IconComp size={16} color={T.rose} />{text}
    </div>
  );
}

/* ────────────────────────────────────────────────────────────
   ROOT APP
   ──────────────────────────────────────────────────────────── */
function Caribbean() {
  const [page, setPage] = useState("home");
  return (
    <div style={{ backgroundColor: T.bg, minHeight: "100vh", fontFamily: "Inter, sans-serif" }}>
      <Header page={page} setPage={setPage} />
      {page === "home" && <HomePage setPage={setPage} />}
      {page === "servicios" && <ServiciosPage setPage={setPage} />}
      {page === "nosotros" && <NosotrosPage />}
      <Footer setPage={setPage} />
      <WhatsAppFAB />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Caribbean />);
</script>
</body>
</html>
